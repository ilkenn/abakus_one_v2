name: abakus_one_v2
description: "Abakus Bowl Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  battery_plus: ^7.1.1
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  connectivity_plus: ^7.3.1
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  # 2026-11-05 — native-memory allocation (`calloc`/`.toNativeUtf16()`) for
  # the same Windows raw-printer integration as `win32` below; already a
  # transitive dependency of `win32`, promoted to direct since
  # `windows_raw_printer_adapter.dart` imports it by name.
  ffi: ^2.2.0
  firebase_app_check: ^0.4.6
  firebase_auth: ^6.5.7
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.7
  firebase_messaging: ^16.5.0
  firebase_remote_config: ^6.5.6
  firebase_storage: ^13.4.6
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_riverpod: ^2.5.1
  # Pinned below ^11.0.0 (AP-3): 11.0.0 raised its Android compileSdk requirement to 37, which
  # exceeds this project's Android Gradle Plugin 9.0.1 ceiling (max recommended compileSdk 36) —
  # confirmed via a real `:app:checkDevelopmentProfileAarMetadata` build failure, not guessed.
  # 10.3.1 has no API this codebase uses from 11.0.0's breaking changes (encryptedSharedPreferences/
  # sharedPreferencesName removal, RSA_ECB_PKCS1Padding/AES_CBC_PKCS7Padding removal) — verified via
  # a repo-wide search finding zero references to any of them.
  flutter_secure_storage: ">=10.3.1 <11.0.0"
  # 2026-10-29 — web-only, used by `usePathUrlStrategy()` in `main.dart` so
  # a path like `/table/<token>` survives Flutter web's default hash
  # ('/#/table/<token>') URL strategy; without it, go_router's initial
  # `matchedLocation` resolves to `/` on a fresh page load, silently
  # bypassing `AppRouteGuard`'s existing `/table` exemption (which was
  # never the bug) and falling through to the normal onboarding/login
  # redirect. SDK package, not pub.dev — no version to pin.
  flutter_web_plugins:
    sdk: flutter
  geolocator: ^14.0.3
  go_router: ^17.3.0
  # 2026-10-29 — user-approved, scoped addition for the "Warm Artisanal &
  # Craft" customer QR-ordering redesign only (see
  # `lib/core/theme/qr_menu_theme.dart`'s own doc comment). Provides
  # Plus Jakarta Sans/Outfit/Inter for that scoped theme — the global
  # `AppTypography` (core/theme/app_typography.dart) deliberately stays on
  # the platform default font, unchanged.
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.18.0
  http: ^1.6.0
  image_picker: ^1.2.3
  latlong2: ^0.10.1
  mobile_scanner: ^7.0.0
  shared_preferences: ^2.5.5
  # 2026-11-05 — real Windows raw-spooler printing for the 80mm ESC/POS
  # till receipt (`features/printing/data/windows_raw_printer_adapter
  # .dart`): the user-confirmed printer ("POS80 Printer") is a Windows-
  # installed USB device reached only through `winspool.drv`
  # (OpenPrinter/StartDocPrinter/WritePrinter) — win32 is the official,
  # actively maintained Dart FFI binding for that API. Already a
  # transitive dependency; promoted to direct since this feature calls it
  # by name.
  win32: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_secure_storage_platform_interface: ^2.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding/
    # 2026-11-02 — real menu product photos, added incrementally per
    # category (each folder may be empty today; `MenuImageResolver`'s
    # per-category lookup relies on `Image`'s own `errorBuilder` to fall
    # back to a placeholder for any product whose file hasn't been added
    # yet, never a manually-maintained "which files exist" allowlist). One
    # entry per real, active `MenuCategory.id`, with its `cat_` prefix AND
    # any trailing product-refresh "2" suffix stripped (e.g. `cat_wrap2` ->
    # `wrap`) — never a second, hand-authored slug list to drift out of
    # sync with the catalog. The old flat `assets/images/menu/*.png`
    # allowlist convention has been retired; its backing files are gone.
    - assets/images/menu/icecekler/
    - assets/images/menu/kahvalti/
    - assets/images/menu/tartine/
    - assets/images/menu/bowl/
    - assets/images/menu/tava/
    - assets/images/menu/salata/
    - assets/images/menu/hamburger/
    - assets/images/menu/wrap/
    - assets/images/menu/makarna/
    - assets/images/menu/atistirmalik/
    - assets/images/products/
    - assets/images/products/Proteinler/
    - assets/images/products/Karbonhidratlar/
    - assets/images/products/Salatalar/
    - assets/images/products/Sebzeler/
    - assets/images/products/Meyveler/
    - assets/images/products/Turşular/
    - assets/images/products/Peynirler/
    - assets/images/products/Diğerleri/
    - assets/images/products/Soslar/
    - assets/images/bowl/
    - assets/images/bowl/layers/
    - assets/images/branding/
    - assets/images/home/
    - assets/images/home/order_modes/
    - assets/images/home/categories/
    - assets/images/home/banner/
    - assets/images/banners/